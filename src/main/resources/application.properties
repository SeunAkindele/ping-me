# Stage 3 — Runtime configuration (override via env in Docker / production).
spring.application.name=PingMe
server.port=8080

# PostgreSQL (override with env vars in Docker / production)
spring.datasource.url=${PINGME_DB_URL:jdbc:postgresql://localhost:5432/pingme}
spring.datasource.username=${PINGME_DB_USER:pingme}
spring.datasource.password=${PINGME_DB_PASSWORD:pingme}

# Hibernate validates schema against entities; Flyway owns DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Stage 5/6 — Background thread pool for scheduler and worker.
#
# Pool size 2: one thread for the scheduler, one for the worker. They run independently
# and must not block each other. With pool size 1, the worker could not run until the
# scheduler's tick finishes (and vice versa), defeating the purpose of separating them.
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=pingme-bg-

# Scheduler (producer): scans reminders table, claims due rows, creates jobs.
# fixedDelay waits until the previous claim finishes, so this JVM does not overlap itself.
# A second application instance is a different story: row locks cover that (see ReminderClaimRepository).
pingme.scheduler.enabled=true
pingme.scheduler.interval=30s
pingme.scheduler.batch-size=100

# Stage 6 — Worker (consumer): drains the job queue and sends notifications.
#
# Runs on a separate schedule from the scheduler because it does different work:
#   Scheduler = fast (database index scan)   →  can run less often (30s)
#   Worker    = slow (notification I/O)      →  should run more often (10s)
#
# batch-size caps how many jobs the worker claims per tick. If you have 1000 queued jobs
# and batch-size is 50, it takes 20 ticks to drain them. This prevents one tick from
# holding too many row locks or spending too long in a single processing loop.
pingme.worker.enabled=true
pingme.worker.interval=10s
pingme.worker.batch-size=50
